<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secret Santa</title>
    <style>
      h1, p {
        background-color: rgba(255, 255, 255, 0.5);
        padding: 15px;
        border-radius: 5px;
      }
    </style>
    <!-- <base href="/" /> -->
    <base href="https://NariddhsSecretSanta.github.io/en/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SecretSanta.styles.css" rel="stylesheet" />
    <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location))
    </script>
</head>

<body style="background-image: url('ChristmasFinn.jpeg'); background-size: cover; background-repeat: no-repeat; background-position: center; background-attachment: fixed;">
    <div id="app" class="container text-center p-0" style="height: 100vh;">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
